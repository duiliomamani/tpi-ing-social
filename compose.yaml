name: voiceshield-lab

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${VOICESHIELD_API_PORT:-8003}/api
    ports:
      - "127.0.0.1:${VOICESHIELD_FRONTEND_PORT:-3002}:3000"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen3.5:2b
      QWEN_TTS_BASE_URL: http://qwen-tts:8001
      QWEN_TTS_API_KEY: ${QWEN_TTS_API_KEY:-local-demo-only}
      QWEN_TTS_MODEL: ${QWEN_TTS_MODEL:-Qwen/Qwen3-TTS-12Hz-0.6B-Base}
      HF_HOME: /root/.cache/huggingface
    ports:
      - "127.0.0.1:${VOICESHIELD_API_PORT:-8003}:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/weights:/app/weights
      - huggingface_cache:/root/.cache/huggingface
    depends_on:
      ollama:
        condition: service_healthy
      ollama-model:
        condition: service_completed_successfully
      qwen-tts:
        condition: service_healthy
    restart: unless-stopped

  qwen-tts:
    build:
      context: ./backend
      dockerfile: Dockerfile.qwen-tts
    environment:
      QWEN_TTS_MODEL: ${QWEN_TTS_MODEL:-Qwen/Qwen3-TTS-12Hz-0.6B-Base}
      QWEN_TTS_API_KEY: ${QWEN_TTS_API_KEY:-local-demo-only}
      QWEN_TTS_CPU_THREADS: ${QWEN_TTS_CPU_THREADS:-4}
      HF_HOME: /root/.cache/huggingface
      OMP_NUM_THREADS: ${QWEN_TTS_CPU_THREADS:-4}
    expose:
      - "8001"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  ollama-model:
    image: ollama/ollama:latest
    entrypoint: ["ollama"]
    command: ["pull", "qwen3.5:2b"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  ollama_data:
  huggingface_cache:
